name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
  conformance:
    name: conformance (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is only the required check label; Playwright 1.56.1
          # cannot install Chromium dependencies on Ubuntu 26.04.
          - label: ubuntu-latest
            os: ubuntu-24.04
            node: 22
          - label: macos-latest
            os: macos-latest
            node: 22
          - label: windows-latest
            os: windows-latest
            node: 22
          - label: ubuntu-latest, Node 24
            os: ubuntu-24.04
            node: 24
          - label: macos-latest, Node 24
            os: macos-latest
            node: 24
          - label: windows-latest, Node 24
            os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      # Commit SHAs are the objects each release tag peels to. Annotated tags use ^{}.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run typecheck
      - run: pnpm validate:schemas
      - run: pnpm test --exclude conformance/codex-proxy-real.test.ts
      - name: Verify tests leave the worktree clean
        if: always()
        shell: bash
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Install Codex CLI 0.163.0
        run: npm install -g @openai/codex@0.163.0
      - name: Verify Codex proxy routing
        shell: bash
        run: SEALBRIDGE_CODEX_BIN=codex pnpm exec vitest run conformance/codex-proxy-real.test.ts
      - name: Install browser for static site checks
        run: pnpm --filter @sealbridge/sites exec playwright install --with-deps chromium
      - name: Verify static sites and invite privacy
        run: pnpm --filter @sealbridge/sites test
      - name: Run Security Proof Suite (Red-Team Adversarial Tests)
        run: pnpm test:security-proof
      - run: pnpm acp demo
