name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Commit SHAs are the objects each release tag peels to. Annotated tags use ^{}.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Temporary Windows delivery repetition and filesystem timing
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pass=0
          fail=0
          for i in $(seq 1 15); do
            if pnpm exec vitest run conformance/issue-regressions.test.ts -t "two relay URLs"; then
              echo "REPEAT $i/15 PASS"
              pass=$((pass + 1))
            else
              echo "REPEAT $i/15 FAIL"
              fail=$((fail + 1))
            fi
          done
          echo "REPEAT SUMMARY pass=$pass fail=$fail"
          outbox_pass=0
          outbox_fail=0
          for i in $(seq 1 3); do
            if pnpm exec vitest run conformance/outbox-runtime.test.ts; then
              echo "OUTBOX REPEAT $i/3 PASS"
              outbox_pass=$((outbox_pass + 1))
            else
              echo "OUTBOX REPEAT $i/3 FAIL"
              outbox_fail=$((outbox_fail + 1))
            fi
          done
          echo "OUTBOX REPEAT SUMMARY pass=$outbox_pass fail=$outbox_fail"
          node -e '
            const fs = require("node:fs"), os = require("node:os"), path = require("node:path");
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), "sealbridge-fs-timing-"));
            const temporary = path.join(dir, "pending"), target = path.join(dir, "record");
            const bytes = Buffer.alloc(4096, 120), iterations = 200;
            try {
              let start = performance.now();
              for (let i = 0; i < iterations; i++) {
                fs.writeFileSync(temporary, bytes, { mode: 0o600 });
                fs.renameSync(temporary, target);
              }
              console.log("writeFileSync+renameSync average_ms=" + ((performance.now() - start) / iterations).toFixed(3));
              start = performance.now();
              for (let i = 0; i < iterations; i++) {
                const fd = fs.openSync(temporary, "w", 0o600);
                try { fs.writeFileSync(fd, bytes); fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
              }
              console.log("writeFileSync+fsyncSync average_ms=" + ((performance.now() - start) / iterations).toFixed(3));
            } finally { fs.rmSync(dir, { recursive: true, force: true }); }
          '
          test "$fail" -eq 0 && test "$outbox_fail" -eq 0
      - run: pnpm run typecheck
      - run: pnpm validate:schemas
      - run: pnpm test --exclude conformance/codex-proxy-real.test.ts
      - name: Install Codex CLI 0.163.0
        run: npm install -g @openai/codex@0.163.0
      - name: Verify Codex proxy routing
        shell: bash
        run: SEALBRIDGE_CODEX_BIN=codex pnpm exec vitest run conformance/codex-proxy-real.test.ts
      - name: Install browser for static site checks
        run: pnpm --filter @sealbridge/sites exec playwright install --with-deps chromium
      - name: Verify static sites and invite privacy
        run: pnpm --filter @sealbridge/sites test
      - name: Run Security Proof Suite (Red-Team Adversarial Tests)
        run: pnpm test:security-proof
      - run: pnpm acp demo
