name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Commit SHAs are the objects each release tag peels to. Annotated tags use ^{}.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Temporarily repeat connections admission on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pass=0
          fail=0
          for i in $(seq 1 20); do
            if pnpm exec vitest run conformance/connections-admission.test.ts; then
              pass=$((pass + 1))
              echo "REPEAT $i/20 PASS"
            else
              fail=$((fail + 1))
              echo "REPEAT $i/20 FAIL"
            fi
          done
          echo "REPEAT SUMMARY pass=$pass fail=$fail"
          load_pass=0
          load_fail=0
          for i in $(seq 1 5); do
            if pnpm exec vitest run conformance/connections-admission.test.ts conformance/worker-acceptance-policy.test.ts conformance/sprint1-inbox.test.ts conformance/connections-migration.test.ts --fileParallelism --maxWorkers=4; then
              load_pass=$((load_pass + 1))
              echo "REPEAT-LOAD $i/5 PASS"
            else
              load_fail=$((load_fail + 1))
              echo "REPEAT-LOAD $i/5 FAIL"
            fi
          done
          echo "REPEAT-LOAD SUMMARY pass=$load_pass fail=$load_fail"
          test "$fail" -eq 0 && test "$load_fail" -eq 0
      - run: pnpm run typecheck
      - run: pnpm validate:schemas
      - run: pnpm test --exclude conformance/codex-proxy-real.test.ts
      - name: Install Codex CLI 0.163.0
        run: npm install -g @openai/codex@0.163.0
      - name: Verify Codex proxy routing
        shell: bash
        run: SEALBRIDGE_CODEX_BIN=codex pnpm exec vitest run conformance/codex-proxy-real.test.ts
      - name: Install browser for static site checks
        run: pnpm --filter @sealbridge/sites exec playwright install --with-deps chromium
      - name: Verify static sites and invite privacy
        run: pnpm --filter @sealbridge/sites test
      - name: Run Security Proof Suite (Red-Team Adversarial Tests)
        run: pnpm test:security-proof
      - run: pnpm acp demo
