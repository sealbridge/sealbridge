name: Installer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run conformance/doctor.test.ts
      - name: Check installer Node resolution (Unix)
        if: runner.os != 'Windows'
        run: pnpm exec vitest run conformance/installer-node.test.ts
      - name: Check installer Node resolution (Windows PowerShell 5.1 and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm exec vitest run conformance/installer-node.test.ts
      - run: npm pack
      - name: Install in a clean user directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export SEALBRIDGE_INSTALL_TARBALL="$PWD/$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")"
          export HOME="$(mktemp -d)"
          export HOME="$(cd "$HOME" && pwd -P)"
          mkdir -p "$HOME/fake-node"
          printf '#!/bin/sh\nexit 1\n' > "$HOME/fake-node/node"
          chmod +x "$HOME/fake-node/node"
          export PATH="$HOME/fake-node:$PATH"
          sh sites/install.sh
          sh sites/install.sh
          . "$HOME/.profile"
          cd "$HOME"
          sealbridge --version
          # HOME began empty; installation must not require config or keys.
          sealbridge doctor --offline
          sealbridge doctor
          SEALBRIDGE_KEY_STORE=file sealbridge doctor --offline
          SEALBRIDGE_KEY_STORE=file sealbridge doctor
          sealbridge demo
          sh "$GITHUB_WORKSPACE/sites/install.sh" --uninstall
          test ! -d "$HOME/.local/share/sealbridge"
      - name: Install in a clean user directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'sealbridge-clean-home'
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Path $env:USERPROFILE | Out-Null
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'sealbridge-clean-user'
          $env:SEALBRIDGE_INSTALL_TARBALL = Join-Path $PWD (node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & ./sites/install.ps1 -NoProfile
          & ./sites/install.ps1 -NoProfile
          Set-Location $env:RUNNER_TEMP
          sealbridge.cmd --version
          if ($LASTEXITCODE -ne 0) { throw 'version failed' }
          foreach ($keyStore in @($null, 'file')) {
            $env:SEALBRIDGE_KEY_STORE = $keyStore
            sealbridge.cmd doctor --offline
            if ($LASTEXITCODE -ne 0) { throw 'offline doctor failed in fresh HOME' }
            sealbridge.cmd doctor
            if ($LASTEXITCODE -ne 0) { throw 'doctor failed in fresh HOME' }
          }
          $env:SEALBRIDGE_KEY_STORE = $null
          sealbridge.cmd demo
          if ($LASTEXITCODE -ne 0) { throw 'demo failed' }
          & "$env:GITHUB_WORKSPACE/sites/install.ps1" -Uninstall -NoProfile
      - name: Install with an npm-less Node (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export SEALBRIDGE_INSTALL_TARBALL="$PWD/$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")"
          runner_node="$(node -p process.execPath)"
          pinned_version="$(awk -F= '/^NODE_VERSION=/ {print $2}' sites/install.sh)"
          export HOME="$(mktemp -d)"
          export HOME="$(cd "$HOME" && pwd -P)"
          mkdir -p "$HOME/node-only"
          cp "$runner_node" "$HOME/node-only/node"
          export PATH="$HOME/node-only:$PATH"
          test "$(node -p process.execPath)" = "$HOME/node-only/node"
          test ! -e "$HOME/node-only/npm"
          sh sites/install.sh | tee "$HOME/install.log"
          . "$HOME/.profile"
          expected_node="$HOME/.local/share/sealbridge/node/bin/node"
          grep -F "Node.js: $pinned_version ($expected_node)" "$HOME/install.log"
          sealbridge --version
          sealbridge doctor > "$HOME/doctor.log" || true
          cat "$HOME/doctor.log"
          grep -F "Node.js: $pinned_version ($expected_node) (OK)" "$HOME/doctor.log"
          test -x "$HOME/node-only/node"
          sh sites/install.sh --uninstall
      - name: Install with an npm-less Node (Windows PowerShell 5.1 and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tarball = Join-Path $PWD (node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")
          $runnerNode = node -p process.execPath
          $originalPath = $env:Path
          $originalModulePath = $env:PSModulePath
          $installer = Join-Path $PWD 'sites/install.ps1'
          $pinnedVersion = (Select-String -LiteralPath $installer -Pattern '^\$nodeVersion = ''([^'']+)''$').Matches.Groups[1].Value
          foreach ($shell in @('powershell.exe', 'pwsh')) {
            $shellPath = (Get-Command $shell).Source
            $homeDir = Join-Path $env:RUNNER_TEMP ("sealbridge-node-only-" + $shell)
            New-Item -ItemType Directory -Force -Path "$homeDir/node-only" | Out-Null
            Copy-Item -LiteralPath $runnerNode -Destination "$homeDir/node-only/node.exe"
            $env:LOCALAPPDATA = $homeDir
            $env:SEALBRIDGE_INSTALL_TARBALL = $tarball
            $env:Path = "$homeDir/node-only;$originalPath"
            $env:SEALBRIDGE_TEST_INSTALLER = $installer
            $env:SEALBRIDGE_TEST_PINNED_VERSION = $pinnedVersion
            # Windows PowerShell must initialize its own module search paths.
            if ($shell -eq 'powershell.exe') { $env:PSModulePath = $null }
            try {
              & $shellPath -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command {
                $ErrorActionPreference = 'Stop'
                $expectedNode = Join-Path $env:LOCALAPPDATA 'Sealbridge/node/node.exe'
                $copiedNode = Join-Path $env:LOCALAPPDATA 'node-only/node.exe'
                if ((node -p process.execPath) -ne $copiedNode) { throw 'copied Node is not first on PATH' }
                if (Test-Path (Join-Path $env:LOCALAPPDATA 'node-only/npm.cmd')) { throw 'fixture includes npm' }
                $installOutput = & $env:SEALBRIDGE_TEST_INSTALLER -NoProfile 6>&1 | Out-String
                Write-Host $installOutput
                if (!$installOutput.Contains("Node.js: $env:SEALBRIDGE_TEST_PINNED_VERSION ($expectedNode)")) { throw 'installer runtime mismatch' }
                sealbridge.cmd --version
                if ($LASTEXITCODE -ne 0) { throw 'version failed' }
                $doctor = sealbridge.cmd doctor | Out-String
                Write-Host $doctor
                if (!$doctor.Contains("Node.js: $env:SEALBRIDGE_TEST_PINNED_VERSION ($expectedNode) (OK)")) { throw 'doctor runtime mismatch' }
                if (!(Test-Path -LiteralPath $copiedNode)) { throw 'original Node was removed' }
                & $env:SEALBRIDGE_TEST_INSTALLER -Uninstall -NoProfile
              }
            } finally { $env:PSModulePath = $originalModulePath }
            if ($LASTEXITCODE -ne 0) { throw "$shell npm-less installation failed" }
          }

      - name: Pack local distribution
        run: npm pack ./dist-local --ignore-scripts
      - name: Install local distribution (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export SEALBRIDGE_INSTALL_TARBALL="$PWD/sealbridge-local-$(node -p "require('./package.json').version").tgz"
          export HOME="$(mktemp -d)"
          export HOME="$(cd "$HOME" && pwd -P)"
          sh sites/install.sh --package sealbridge-local
          . "$HOME/.profile"
          sealbridge-local --version
          sealbridge-local worker start --help
          sealbridge-local doctor --offline
          sealbridge-local config local-pc status
          sealbridge-local config local-pc off
          if sealbridge-local worker start --adapter sandbox; then exit 1; fi
          sh sites/install.sh --uninstall
      - name: Install local distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'sealbridge-local-clean-user'
          $env:SEALBRIDGE_INSTALL_TARBALL = Join-Path $PWD ("sealbridge-local-" + (node -p "require('./package.json').version") + '.tgz')
          & ./sites/install.ps1 -NoProfile -PackageName sealbridge-local
          sealbridge-local.cmd --version
          if ($LASTEXITCODE -ne 0) { throw 'local version failed' }
          sealbridge-local.cmd worker start --help
          if ($LASTEXITCODE -ne 0) { throw 'local help failed' }
          sealbridge-local.cmd doctor --offline
          if ($LASTEXITCODE -ne 0) { throw 'local doctor failed' }
          sealbridge-local.cmd config local-pc status
          if ($LASTEXITCODE -ne 0) { throw 'local status failed' }
          sealbridge-local.cmd config local-pc off
          if ($LASTEXITCODE -ne 0) { throw 'local revoke failed' }
          sealbridge-local.cmd worker start --adapter sandbox
          if ($LASTEXITCODE -eq 0) { throw 'noninteractive startup was allowed' }
          # The rejection above is expected, not the exit status of this step.
          $global:LASTEXITCODE = 0
          & ./sites/install.ps1 -NoProfile -Uninstall
