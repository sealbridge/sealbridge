name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment before releasing.
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Check version and publication status
        id: guard
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$REF_TYPE" == 'tag' ]]; then
            TAG_VERSION=${REF_NAME#v}
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag version ${TAG_VERSION} does not match package.json version ${VERSION}"
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Missing versions can return empty output or fail with E404.
          PUBLISHED_VERSION=$(npm view "sealbridge@${VERSION}" version 2>/dev/null) || PUBLISHED_VERSION=''
          if [[ -n "$PUBLISHED_VERSION" ]]; then
            echo "::notice::sealbridge@${VERSION} is already published; skipping."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.skip != 'true'
      - run: pnpm build
        if: steps.guard.outputs.skip != 'true'
      - run: pnpm run typecheck
        if: steps.guard.outputs.skip != 'true'
      - run: pnpm validate:schemas
        if: steps.guard.outputs.skip != 'true'
      - run: pnpm test
        if: steps.guard.outputs.skip != 'true'
      # Authentication uses npm Trusted Publishing (OIDC); prepack builds dist/.
      - run: npm publish --access public --provenance
        if: steps.guard.outputs.skip != 'true'
