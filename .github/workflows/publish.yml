name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment before releasing.
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Check version and publication status
        id: guard
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$REF_TYPE" == 'tag' ]]; then
            TAG_VERSION=${REF_NAME#v}
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag version ${TAG_VERSION} does not match package.json version ${VERSION}"
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Check both names; a retry can finish a partially published pair.
          for NAME in sealbridge sealbridge-local; do
            PUBLISHED_VERSION=$(npm view "${NAME}@${VERSION}" version 2>/dev/null) || PUBLISHED_VERSION=''
            if [[ -n "$PUBLISHED_VERSION" ]]; then
              echo "${NAME}=published" >> "$GITHUB_OUTPUT"
            fi
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run typecheck
      - run: pnpm validate:schemas
      - run: pnpm test
      - run: pnpm run check:protocol-release
      - run: node scripts/package-cli.mjs
      # Freeze both payloads and preflight BOTH before the first registry write.
      - name: Pack and dry-run both distributions
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          npm pack ./dist-local --ignore-scripts
          VERSION=$(node -p "require('./package.json').version")
          # An already-published version cannot pass npm publish --dry-run.
          # Still validate its frozen tarball; dry-run every pending registry write.
          npm pack "./sealbridge-${VERSION}.tgz" --dry-run --ignore-scripts
          npm pack "./sealbridge-local-${VERSION}.tgz" --dry-run --ignore-scripts
          if [[ "${{ steps.guard.outputs.sealbridge }}" != published ]]; then
            npm publish "./sealbridge-${VERSION}.tgz" --dry-run --access public --provenance
          fi
          if [[ "${{ steps.guard.outputs['sealbridge-local'] }}" != published ]]; then
            npm publish "./sealbridge-local-${VERSION}.tgz" --dry-run --access public --provenance
          fi
      # npm has no multi-package transaction. Preflight prevents validation failures
      # after one write; a network/registry failure can still require a retry.
      # Authentication retains npm Trusted Publishing (OIDC) and environment approval.
      - name: Publish mainline
        if: steps.guard.outputs.sealbridge != 'published'
        run: npm publish "./sealbridge-${{ steps.guard.outputs.version }}.tgz" --access public --provenance
      - name: Publish local distribution
        if: steps.guard.outputs['sealbridge-local'] != 'published'
        run: npm publish "./sealbridge-local-${{ steps.guard.outputs.version }}.tgz" --access public --provenance
