# Smithery.ai MCP server configuration for Sealbridge
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - keyFile
    properties:
      keyFile:
        type: string
        description: Path to the Ed25519 owner private key JSON file (generated via `pnpm sealbridge keygen <path>`).
      relayUrl:
        type: string
        description: Optional untrusted E2EE Blind Relay endpoint URL; omit to use the CLI relay selection.
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: [
        'cli/dist/index.js',
        'mcp-server',
        '--key',
        config.keyFile,
        ...(config.relayUrl ? ['--relay', config.relayUrl] : [])
      ]
    })
